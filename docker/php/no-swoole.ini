; Questo file viene montato SOPRA /etc/php/8.3/cli/conf.d/25-swoole.ini del
; container Sail, così l'estensione swoole non viene caricata.
;
; Perché: con swoole attiva `php artisan test` muore di segfault — niente
; messaggio, niente stack trace, solo exit 255 e l'output troncato a metà
; suite. Il primo test a cadere è quello che usa `withoutDefer()` con
; `Mail::fake()` (tests/Feature/Admin/AdminAuthTest.php): swoole aggancia gli
; shutdown handler su cui poggiano i deferred callback di Laravel.
;
; Il progetto non usa swoole (niente Octane), quindi non si perde nulla.
; Se un giorno servisse, il segfault va indagato prima di rimuovere questo file.
